<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KPロガー</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KPロガー">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#183a66">
<style>
:root{--bg:#f2f4f7;--panel:#fff;--ink:#1c2128;--ink2:#5b6672;--line:#d7dde4;--navy:#183a66;--red:#d2322d;--green:#288c46;--blue:#1e64e6;--amber:#ffd25a}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--panel:#1a2129;--ink:#e8edf2;--ink2:#9aa7b3;--line:#2b3641}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Meiryo UI","Yu Gothic UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;gap:8px;padding:max(8px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));height:100dvh;overflow:hidden;user-select:none}
#hdr{background:var(--navy);color:#fff;border-radius:16px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:end;flex:none}
#route{grid-column:1/3;font-size:12px;color:#b9cbe6;display:flex;justify-content:space-between;gap:8px}
#kp{font-size:clamp(44px,15vw,64px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
#kp small{font-size:.38em;color:var(--amber);margin-left:6px;font-weight:700;letter-spacing:0}
#geo{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#b9cbe6;margin-top:6px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
#geo b{color:#fff;font-weight:600}
#geo button,#geo a{border:1px solid #ffffff55;background:#ffffff1a;color:#fff;border-radius:8px;padding:2px 8px;font:inherit;font-size:11px;text-decoration:none;cursor:pointer}
#geo .g{display:flex;gap:6px;align-items:center}
#side{font-size:13px;line-height:1.45;color:#b9cbe6;text-align:right}
#side b{color:#fff;font-size:14px}
.chip{display:inline-block;border-radius:10px;padding:0 7px;font-size:11px;font-weight:700;background:#ffffff26;color:#fff}
.chip.ok{background:#2f9e5a}.chip.ng{background:#c8453f}.chip.est{background:#c68a10}
#mapbox{position:relative;flex:1 1 auto;min-height:150px;border-radius:16px;overflow:hidden;background:#e8ecef;border:1px solid var(--line);touch-action:none}
@media (prefers-color-scheme:dark){#mapbox{background:#1f2a31}}
canvas{display:block;width:100%;height:100%}
.mb{position:absolute;width:38px;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;font-weight:700;display:grid;place-items:center;cursor:pointer;padding:0}
#zi{right:8px;top:8px}#zo{right:8px;top:52px}#zf{right:8px;top:96px;font-size:12px}#fl{right:8px;top:140px;font-size:12px}
#fl[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
#lg{position:absolute;left:8px;top:8px;background:#ffffffe6;color:#1c2128;border-radius:10px;padding:4px 8px;font-size:11px;line-height:1.5}
#btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.big{border:0;border-radius:20px;color:#fff;font:inherit;font-size:30px;font-weight:800;padding:12px 0 8px;cursor:pointer;line-height:1.1}
.big span{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:2px}
.big:active{transform:scale(.97);filter:brightness(.9)}
#cut{background:var(--red)}#con{background:var(--green)}
#logbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;flex:0 1 auto;max-height:30dvh;min-height:84px;display:flex;flex-direction:column;overflow:hidden}
#lh{display:flex;justify-content:space-between;align-items:center;padding:6px 12px 2px;font-size:12px;color:var(--ink2);font-weight:700;gap:6px;flex-wrap:wrap}
#lh .acts{display:flex;gap:10px}
#lh button{border:0;background:none;color:var(--blue);font:inherit;font-size:12px;font-weight:700;padding:2px 0;cursor:pointer}
#lh button.del{color:var(--red)}
#ll{overflow:auto;padding:0 12px 6px;font-size:13px}
.s{font-size:11px;color:var(--ink2);padding:0 0 3px;font-variant-numeric:tabular-nums}
.r{display:grid;grid-template-columns:62px 38px 1fr auto;gap:6px;padding:3px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.r:first-child{border-top:0}.t0{color:var(--red);font-weight:700}.t1{color:var(--green);font-weight:700}.r i{color:var(--ink2);font-style:normal;font-size:11px;align-self:center}
#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none;font-size:11px;color:var(--ink2)}
#bar select,#bar button,#bar input[type=number]{font:inherit;font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 6px}
#bar label{display:flex;gap:4px;align-items:center}
#sim{display:none;gap:6px;align-items:center;flex-wrap:wrap}
#toast{text-align:center;line-height:1.5;position:fixed;left:50%;bottom:22%;transform:translateX(-50%);background:#111c;color:#fff;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:700;display:none;z-index:9;white-space:nowrap}
#toast button{margin-left:10px;border:1px solid #fff8;background:none;color:#fff;border-radius:8px;padding:2px 8px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="hdr">
  <div id="route"><span id="rt">位置待ち</span><span id="gps" class="chip ng">GPS待ち</span></div>
  <div id="kp">---.-<small>KP</small></div>
  <div id="side"><div>次: <b id="nx">-</b></div><div id="nxd">&nbsp;</div><div id="spd">-- km/h</div></div>
  <div id="geo"><span>緯度経度 <b id="ll2">--, --</b></span><span>標高 <b id="el">--</b></span><span class="g"><button id="cpll">コピー</button><a id="gm" href="#" target="_blank" rel="noopener">Googleマップ</a></span></div>
</div>
<div id="mapbox">
  <canvas id="cv"></canvas>
  <div id="lg">× 切断 ／ ○ 接続</div>
  <button class="mb" id="zi" aria-label="拡大">＋</button><button class="mb" id="zo" aria-label="縮小">－</button>
  <button class="mb" id="zf">全体</button><button class="mb" id="fl" aria-pressed="true">追従</button>
</div>
<div id="btns">
  <button class="big" id="cut">切断<span>通信が切れた</span></button>
  <button class="big" id="con">接続<span>通信が戻った</span></button>
</div>
<div id="logbox">
  <div id="lh"><span id="lc">記録(0件)</span><span class="acts"><button id="undo">取消</button><button id="csv">CSV出力</button><button id="cp">コピー</button><button id="clr" class="del">全削除</button></span></div>
  <div id="ll"></div>
</div>
<div id="bar">
  <label>KP桁数<select id="ksel"><option value="1">0.1</option><option value="2">0.01</option><option value="3">0.001</option></select></label>
  <label>方向<select id="dsel"><option value="">自動</option><option value="dn">下り</option><option value="up">上り</option></select></label>
  <label><input type="checkbox" id="auto">ブラウザの接続状態を自動記録(参考)</label>
  <button id="simt">テスト走行</button>
  <span id="sim"><input id="skp" type="number" step="0.1" value="340" style="width:70px">KPから
    <select id="ssp"><option value="1">×1</option><option value="5" selected>×5</option><option value="20">×20</option></select>
    <select id="srt"><option value="chugoku">中国道</option><option value="sanyo">山陽道</option></select>
    <select id="sdr"><option value="dn">下り</option><option value="up">上り</option></select>
    <button id="sgo">開始</button></span>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const D=JSON.parse($('kpdata').textContent);
const rad=Math.PI/180,RE=6371000,RM=6378137;
const dist=(a,b)=>{const x=(b[1]-a[1])*rad*Math.cos((a[0]+b[0])/2*rad),y=(b[0]-a[0])*rad;return RE*Math.hypot(x,y);};
function dec(s){const o=[];let i=0,la=0,lo=0;while(i<s.length){for(let k=0;k<2;k++){let r=0,sh=0,b;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5;}while(b>=32);const v=(r&1)?~(r>>1):(r>>1);if(k)lo+=v;else la+=v;}o.push([la/1e5,lo/1e5]);}return o;}
const LINES={};
for(const [k,v] of Object.entries(D.lines)){const p=dec(v.poly),s=[0];for(let i=1;i<p.length;i++)s.push(s[i-1]+dist(p[i-1],p[i]));LINES[k]={key:k,p,s,anc:v.anc};}
const ROUTES={
 chugoku:{name:'中国道',dn:'c_dn',up:'c_up',fac:D.fac.chugoku,dnTo:'下関方面',upTo:'吹田方面'},
 sanyo:{name:'山陽道',dn:'s_dn',up:'s_up',fac:D.fac.sanyo,dnTo:'山口方面',upTo:'神戸方面'}};
function decInts(s){const o=[];let i=0,v0=0;while(i<s.length){let r=0,sh=0,b;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5;}while(b>=32);v0+=(r&1)?~(r>>1):(r>>1);o.push(v0);}return o;}
ROUTES.chugoku.elev=decInts(D.info.c_dn.elev);ROUTES.sanyo.elev=decInts(D.info.s_dn.elev);
for(const R of Object.values(ROUTES)){R.ics=R.fac.filter(f=>/IC$|JCT$/.test(f[0]));R.min=R.fac[0][1];R.max=R.fac[R.fac.length-1][1];}
const LROUTE={c_dn:['chugoku','dn'],c_up:['chugoku','up'],s_dn:['sanyo','dn'],s_up:['sanyo','up']};
function kp2s(A,kp){if(kp<=A[0][1])return A[0][0]-(A[0][1]-kp)*1000;for(let i=1;i<A.length;i++)if(kp<=A[i][1])return A[i-1][0]+(A[i][0]-A[i-1][0])*(kp-A[i-1][1])/(A[i][1]-A[i-1][1]);const z=A[A.length-1];return z[0]+(kp-z[1])*1000;}
function s2kp(A,s){if(s<=A[0][0])return A[0][1]-(A[0][0]-s)/1000;for(let i=1;i<A.length;i++)if(s<=A[i][0])return A[i-1][1]+(A[i][1]-A[i-1][1])*(s-A[i-1][0])/(A[i][0]-A[i-1][0]);const z=A[A.length-1];return z[1]+(s-z[0])/1000;}
function posAt(l,s){s=Math.max(0,Math.min(l.s[l.s.length-1],s));let lo=1,hi=l.s.length-1;while(lo<hi){const m=(lo+hi)>>1;if(l.s[m]<s)lo=m+1;else hi=m;}const i=lo;const t=(s-l.s[i-1])/((l.s[i]-l.s[i-1])||1);const a=l.p[i-1],b=l.p[i];return {lat:a[0]+(b[0]-a[0])*t,lon:a[1]+(b[1]-a[1])*t,brg:(Math.atan2((b[1]-a[1])*Math.cos(a[0]*rad),b[0]-a[0])/rad+360)%360};}
function nearest(l,lat,lon){
  const mx=RE*rad*Math.cos(lat*rad),my=RE*rad,p=l.p;let best=1e18,bs=0,bb=0;
  for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i];
    if((a[0]-lat>.004&&b[0]-lat>.004)||(lat-a[0]>.004&&lat-b[0]>.004)||(a[1]-lon>.005&&b[1]-lon>.005)||(lon-a[1]>.005&&lon-b[1]>.005))continue;
    const ax=(a[1]-lon)*mx,ay=(a[0]-lat)*my,bx=(b[1]-lon)*mx,by=(b[0]-lat)*my,dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
    let t=L2?-(ax*dx+ay*dy)/L2:0;t=Math.max(0,Math.min(1,t));const d=Math.hypot(ax+t*dx,ay+t*dy);
    if(d<best){best=d;bs=l.s[i-1]+t*(l.s[i]-l.s[i-1]);bb=(Math.atan2(dx,dy)/rad+360)%360;}}
  return {d:best,s:bs,brg:bb};}
const angd=(a,b)=>{let d=Math.abs(a-b)%360;return d>180?360-d:d;};

/* ---------- 状態 ---------- */
let cur=null,prevFix=null,forceDir='';
let KD=3;try{KD=+localStorage.getItem('kp_digits3')||3;}catch(e){}
const kf=v=>(+v).toFixed(KD);
const LOGKEY='kplog_v1';
let LOG=[];try{LOG=JSON.parse(localStorage.getItem(LOGKEY)||'[]');}catch(e){}
function saveLog(){try{localStorage.setItem(LOGKEY,JSON.stringify(LOG));}catch(e){}}

function onFix(pos){
  const c=pos.coords,t=pos.timestamp||Date.now();let spd=(c.speed!=null&&!isNaN(c.speed))?c.speed:null,hdg=(c.heading!=null&&!isNaN(c.heading))?c.heading:null;
  if(spd==null&&prevFix){const dt=(t-prevFix.t)/1000;if(dt>0.3&&dt<10)spd=dist([prevFix.lat,prevFix.lon],[c.latitude,c.longitude])/dt;}
  prevFix={lat:c.latitude,lon:c.longitude,t};
  let best=null;
  for(const k of Object.keys(LINES)){const [rt,dr]=LROUTE[k];if(forceDir&&dr!==forceDir)continue;
    const n=nearest(LINES[k],c.latitude,c.longitude);const tb=dr==='dn'?n.brg:(n.brg+180)%360;
    const score=n.d+((hdg!=null&&spd>3&&angd(hdg,tb)>100)?250:0);
    if(!best||score<best.score)best={score,k,rt,dr,n,tb};}
  const on=best&&best.n.d<150;
  const next={lat:c.latitude,lon:c.longitude,alt:(c.altitude!=null&&!isNaN(c.altitude))?c.altitude:null,acc:c.accuracy,t,spd,hdg:hdg!=null?hdg:(best?best.tb:null),on};
  if(on){next.route=best.rt;next.dir=best.dr;next.kp=s2kp(LINES[best.k].anc,best.n.s);next.off=best.n.d;}
  else if(cur){next.route=cur.route;next.dir=cur.dir;next.kp=cur.kp;next.stale=true;}
  cur=next;draw();upd();
}
function estimate(){ // 現在値(GPS途切れ時は速度から推定)
  if(!cur||cur.kp==null)return null;
  const age=(Date.now()-cur.t)/1000;
  if(age<=4||!cur.on||!(cur.spd>3)||age>900)return {kp:cur.kp,est:false,age};
  return {kp:cur.kp+(cur.dir==='dn'?1:-1)*cur.spd*age/1000,est:true,age};
}
function elevAt(route,kp){const R=ROUTES[route],E=R.elev,x=Math.max(0,Math.min(E.length-1,kp2s(LINES[R.dn].anc,kp)/250)),i=Math.floor(x),j=Math.min(E.length-1,i+1);return E[i]+(E[j]-E[i])*(x-i);}
function curPos(e){ // GPS途切れ時は推定キロポストから路線上の位置を出す
  if(!cur)return null;if(e&&e.est){const R=ROUTES[cur.route],l=LINES[R[cur.dir]],p=posAt(l,kp2s(l.anc,e.kp));return {lat:p.lat,lon:p.lon,brg:p.brg,est:true};}
  return {lat:cur.lat,lon:cur.lon,brg:cur.hdg,est:false};}
function nextIC(route,dir,kp){const I=ROUTES[route].ics;if(dir==='dn'){for(const f of I)if(f[1]>kp+0.05)return f;}else{for(let i=I.length-1;i>=0;i--)if(I[i][1]<kp-0.05)return I[i];}return null;}
function upd(){
  const e=estimate(),gps=$('gps');
  if(!cur){return;}
  const age=(Date.now()-cur.t)/1000;
  if(cur.kp==null){$('rt').innerHTML='<span class="chip ng">道路外</span> 中国道・山陽道から離れています';$('kp').firstChild.nodeValue='---.-';}
  gps.textContent=age<4?'GPS受信':'GPS途切れ '+Math.round(age)+'秒';gps.className='chip '+(age<4?'ok':'ng');
  if(e){$('kp').firstChild.nodeValue=kf(Math.max(e.kp,-9.9));
    const R=ROUTES[cur.route];$('rt').innerHTML=R.name+'('+(cur.dir==='dn'?'下り':'上り')+') '+(cur.dir==='dn'?R.dnTo:R.upTo)+(e.est?' <span class="chip est">推定</span>':(cur.on?'':' <span class="chip ng">道路外</span>'));
    const n=nextIC(cur.route,cur.dir,e.kp);if(n){$('nx').textContent=n[0];$('nxd').textContent=Math.abs(n[1]-e.kp).toFixed(Math.min(KD,2))+' km';}else{$('nx').textContent='終点';$('nxd').innerHTML='&nbsp;';}
  }
  const cp=curPos(e);if(cp){$('ll2').textContent=cp.lat.toFixed(6)+', '+cp.lon.toFixed(6)+(cp.est?'(推定)':'');$('gm').href='https://www.google.com/maps?q='+cp.lat.toFixed(6)+','+cp.lon.toFixed(6);}
  if(e&&cur.on){let t=Math.round(elevAt(cur.route,e.kp))+' m';if(cur.alt!=null)t+=' (GPS '+Math.round(cur.alt)+' m)';$('el').textContent=t;}else $('el').textContent=cur.alt!=null?'GPS '+Math.round(cur.alt)+' m':'--';
  $('spd').textContent=cur.spd!=null?Math.round(cur.spd*3.6)+' km/h':'-- km/h';
}
/* ---------- 記録 ---------- */
const p2=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
function addLog(type,src){
  const e=estimate();const now=new Date();
  const r={t:fmt(now),ts:now.getTime(),type,src:src||'手動'};
  if(cur){
    const cp=curPos(e);
    r.lat=+cp.lat.toFixed(6);r.lon=+cp.lon.toFixed(6);
    r.galt=cur.alt!=null?Math.round(cur.alt):'';
    r.acc=cur.acc!=null?Math.round(cur.acc):'';r.spd=cur.spd!=null?Math.round(cur.spd*3.6):'';
    if(e){r.route=ROUTES[cur.route].name;r.dir=cur.dir==='dn'?'下り':'上り';r.kp=+e.kp.toFixed(3);if(cur.on)r.elev=Math.round(elevAt(cur.route,e.kp));r.est=e.est?'推定':(cur.on?'':'道路外');}
    else r.est='道路外';
  }else{r.est='位置なし';}
  LOG.push(r);saveLog();renderLog();draw();
  toast('<b>'+type+' '+(r.kp!=null?kf(r.kp)+' KP':'(位置なし)')+'</b>'+(r.lat!=null?'<br><small>'+r.lat.toFixed(6)+', '+r.lon.toFixed(6)+(r.elev!=null?'　標高 '+r.elev+' m':'')+'</small>':''));
}
function renderLog(){
  $('lc').textContent='記録('+LOG.length+'件)';
  const row=r=>{
    const pos=r.lat!=null?r.lat.toFixed(6)+', '+r.lon.toFixed(6):'位置なし';
    const el=[r.elev!=null?'標高 '+r.elev+' m':'',(r.galt!==''&&r.galt!=null)?'GPS '+r.galt+' m':''].filter(Boolean).join(' / ');
    return '<div class="e"><div class="r"><span>'+r.t.slice(11)+'</span><span class="'+(r.type==='切断'?'t0':'t1')+'">'+r.type+'</span><span><b>'+(r.kp!=null?kf(r.kp)+' KP':'--')+'</b> '+(r.dir||'')+'</span><i>'+r.src+(r.est?' '+r.est:'')+'</i></div><div class="s">'+pos+(el?'　'+el:'')+'</div></div>';};
  $('ll').innerHTML=LOG.slice().reverse().slice(0,200).map(row).join('')||'<div class="r"><i>まだ記録がありません</i></div>';
}
function csvText(){
  const H=['時刻','種別','路線','方向','キロポスト','緯度','経度','標高(m)路線データ','標高(m)GPS','精度(m)','速度(km/h)','記録元','備考'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  return H.map(q).join(',')+'\r\n'+LOG.map(r=>[r.t,r.type,r.route,r.dir,r.kp!=null?(+r.kp).toFixed(3):'',r.lat!=null?(+r.lat).toFixed(6):'',r.lon!=null?(+r.lon).toFixed(6):'',r.elev,r.galt,r.acc,r.spd,r.src,r.est].map(q).join(',')).join('\r\n');
}
let toastT=0;
function toast(msg,undo){const t=$('toast');t.innerHTML=msg+(undo===false?'':'<button id="tu">取消</button>');t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',4000);const b=$('tu');if(b)b.onclick=()=>{LOG.pop();saveLog();renderLog();draw();t.style.display='none';};}
$('cut').onclick=()=>addLog('切断');$('con').onclick=()=>addLog('接続');
$('undo').onclick=()=>{if(LOG.length){LOG.pop();saveLog();renderLog();draw();}};
$('clr').onclick=()=>{if(LOG.length&&confirm('記録 '+LOG.length+' 件をすべて削除します。CSV出力は済んでいますか?')){LOG=[];saveLog();renderLog();draw();}};
$('csv').onclick=()=>{if(!LOG.length){toast('記録がありません',false);return;}const b=new Blob(['﻿'+csvText()],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');const d=new Date();a.href=URL.createObjectURL(b);a.download='kp_log_'+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes())+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);};
$('cp').onclick=()=>{const t=csvText();(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('コピーしました',false),()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');toast('コピーしました',false);}catch(e){toast('コピー失敗',false);}x.remove();});};
$('ksel').value=String(KD);
function applyKD(){document.getElementById('kp').style.fontSize=KD>=3?'clamp(38px,12.5vw,56px)':'';}
applyKD();
$('ksel').onchange=e=>{KD=+e.target.value;try{localStorage.setItem('kp_digits3',KD);}catch(_){}applyKD();renderLog();upd();};
$('cpll').onclick=()=>{const cp=cur&&curPos(estimate());if(!cp){toast('位置がありません',false);return;}const t=cp.lat.toFixed(6)+', '+cp.lon.toFixed(6);(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('コピー: '+t,false),()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');toast('コピー: '+t,false);}catch(e){toast('コピー失敗',false);}x.remove();});};
$('dsel').onchange=e=>{forceDir=e.target.value;};
$('auto').onchange=e=>{try{localStorage.setItem('kp_auto',e.target.checked?'1':'');}catch(_){}};
try{$('auto').checked=!!localStorage.getItem('kp_auto');}catch(_){}
addEventListener('offline',()=>{if($('auto').checked)addLog('切断','自動');});
addEventListener('online',()=>{if($('auto').checked)addLog('接続','自動');});

/* ---------- 地図(線形のみ・オフライン) ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
const MX=lon=>RM*lon*rad,MY=lat=>RM*Math.log(Math.tan(Math.PI/4+lat*rad/2));
let W=0,H=0,dpr=1,view={cx:MX(133),cy:MY(34.6),mpp:25},follow=true;
const ZOOMS=[3,6,12,25,50,100,200,400,800,1600];let zi=3;
function resize(){const b=$('mapbox').getBoundingClientRect();dpr=window.devicePixelRatio||1;W=b.width;H=b.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);draw();}
const X=lon=>(MX(lon)-view.cx)/view.mpp+W/2,Y=lat=>-(MY(lat)-view.cy)/view.mpp+H/2;
function pathLine(l){
  let started=false;for(let i=0;i<l.p.length;i++){const x=X(l.p[i][1]),y=Y(l.p[i][0]);
    if(x<-60||x>W+60||y<-60||y>H+60){started=false;continue;}
    if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);}}
function draw(){
  if(!W)return;const dark=matchMedia('(prefers-color-scheme:dark)').matches;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const cpos=cur?curPos(estimate()):null;
  if(follow&&cpos){view.cx=MX(cpos.lon);view.cy=MY(cpos.lat);}
  const rk=cur&&cur.route?cur.route:'chugoku',R=ROUTES[rk];
  ctx.lineWidth=1;ctx.strokeStyle=dark?'#3a4a53':'#b7c3ca';ctx.lineJoin='round';
  ctx.beginPath();for(const c of D.coast){let st=false;for(const q of c){const x=X(q[0]),y=Y(q[1]);if(x<-200||x>W+200||y<-200||y>H+200){st=false;continue;}if(!st){ctx.moveTo(x,y);st=true;}else ctx.lineTo(x,y);}}ctx.stroke();
  for(const k of Object.keys(LINES)){const same=LROUTE[k][0]===rk;ctx.beginPath();pathLine(LINES[k]);ctx.lineWidth=same?4:3;ctx.strokeStyle=same?(LROUTE[k][1]==='dn'?(dark?'#6fa8ff':'#2a78d6'):(dark?'#ff9a6e':'#eb6834')):(dark?'#4b5862':'#c3cbd2');ctx.lineCap='round';ctx.stroke();}
  const spanKm=Math.max(W,H)*view.mpp*Math.cos(34.6*rad)/1000;
  const step=spanKm<6?1:spanKm<30?5:spanKm<120?10:50;
  const lab=spanKm<14||step>=10;
  const l0=LINES[R.dn];const kc=cur&&cur.kp!=null?cur.kp:(R.min+R.max)/2;
  const lo=follow&&cur?Math.max(R.min,kc-spanKm):R.min;
  const hi=follow&&cur?kc+spanKm:R.max;
  ctx.font='10px sans-serif';ctx.textBaseline='middle';
  for(let kp=Math.ceil(lo/step)*step;kp<=hi&&kp<=R.max;kp+=step){const p=posAt(l0,kp2s(l0.anc,kp));const x=X(p.lon),y=Y(p.lat);if(x<-10||x>W+10||y<-10||y>H+10)continue;
    ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fillStyle=dark?'#1a2129':'#fff';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=dark?'#cfd8de':'#3b4650';ctx.stroke();
    if(lab){ctx.fillStyle=dark?'#cfd8de':'#3b4650';ctx.fillText(String(kp),x+6,y-8);}}
  ctx.font='bold 11px "Meiryo UI",sans-serif';
  for(const f of R.ics){const x=X(f[3]),y=Y(f[2]);if(x<-40||x>W+40||y<-20||y>H+20)continue;
    ctx.beginPath();ctx.arc(x,y,4.5,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#183a66';ctx.stroke();
    if(spanKm<60||(/JCT$/.test(f[0])&&spanKm<130)){const w=ctx.measureText(f[0]).width;ctx.fillStyle=dark?'#000a':'#fffd';ctx.fillRect(x+7,y-8,w+6,16);ctx.fillStyle=dark?'#e8edf2':'#183a66';ctx.fillText(f[0],x+10,y);}}
  for(const r of LOG){if(r.lat==null)continue;const x=X(r.lon),y=Y(r.lat);if(x<-20||x>W+20||y<-20||y>H+20)continue;
    ctx.beginPath();ctx.arc(x,y,8,0,7);ctx.fillStyle=r.type==='切断'?'#d2322d':'#288c46';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(r.type==='切断'?'×':'○',x,y+.5);ctx.textAlign='left';}
  if(cur&&cpos){const x=X(cpos.lon),y=Y(cpos.lat);ctx.beginPath();ctx.arc(x,y,18,0,7);ctx.fillStyle='#1e64e633';ctx.fill();
    ctx.save();ctx.translate(x,y);ctx.rotate(((cpos.est?(cur.dir==='dn'?cpos.brg:(cpos.brg+180)%360):cur.hdg)||0)*rad);ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(9,9);ctx.lineTo(0,4);ctx.lineTo(-9,9);ctx.closePath();ctx.fillStyle='#1e64e6';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();ctx.restore();}
}
$('zi').onclick=()=>{zi=Math.max(0,zi-1);view.mpp=ZOOMS[zi];draw();};
$('zo').onclick=()=>{zi=Math.min(ZOOMS.length-1,zi+1);view.mpp=ZOOMS[zi];draw();};
$('fl').onclick=()=>{follow=!follow;$('fl').setAttribute('aria-pressed',follow);draw();};
$('zf').onclick=()=>{follow=false;$('fl').setAttribute('aria-pressed',false);const l=LINES[ROUTES[cur&&cur.route?cur.route:'chugoku'].dn];let a=1e18,b=-1e18,c=1e18,d=-1e18;for(const p of l.p){const x=MX(p[1]),y=MY(p[0]);a=Math.min(a,x);b=Math.max(b,x);c=Math.min(c,y);d=Math.max(d,y);}view.cx=(a+b)/2;view.cy=(c+d)/2;view.mpp=Math.max((b-a)/W,(d-c)/H)*1.1;draw();};
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3&&follow){follow=false;$('fl').setAttribute('aria-pressed',false);}view.cx-=dx*view.mpp;view.cy+=dy*view.mpp;drag={x:e.clientX,y:e.clientY};draw();});
cv.addEventListener('pointerup',()=>{drag=null;});
addEventListener('resize',resize);

/* ---------- GPS / テスト走行 ---------- */
let simTimer=0;
function startGPS(){
  if(!navigator.geolocation){$('gps').textContent='GPS非対応';return;}
  navigator.geolocation.watchPosition(p=>{if(!simTimer)onFix(p);},e=>{$('gps').textContent='GPSエラー: '+(e.code===1?'許可されていません':e.message);$('gps').className='chip ng';},{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
}
$('simt').onclick=()=>{const s=$('sim');s.style.display=s.style.display==='inline-flex'?'none':'inline-flex';};
$('sgo').onclick=()=>{
  if(simTimer){clearInterval(simTimer);simTimer=0;$('sgo').textContent='開始';return;}
  const R=ROUTES[$('srt').value],dr=$('sdr').value,l=LINES[R[dr]],mult=+$('ssp').value;let s=kp2s(l.anc,+$('skp').value||R.min);const v=27.8;
  $('sgo').textContent='停止';
  simTimer=setInterval(()=>{s+=(dr==='dn'?1:-1)*v*mult;const mx=l.s[l.s.length-1];if(s<0||s>mx){clearInterval(simTimer);simTimer=0;$('sgo').textContent='開始';return;}
    const p=posAt(l,s),j=(Math.random()-.5)*8/111000,hb=dr==='dn'?p.brg:(p.brg+180)%360;
    onFix({timestamp:Date.now(),coords:{latitude:p.lat+j,longitude:p.lon+j,accuracy:5,speed:v,heading:hb}});},1000);};
setInterval(()=>{upd();if(cur)draw();},1000);
window.__kp={LINES,ROUTES,nearest,s2kp,kp2s,posAt,onFix,addLog,getLog:()=>LOG,getCur:()=>cur};
function startBridge(){
  let lastT=0;$('gps').textContent='iPhone待ち';
  setInterval(async()=>{
    try{const r=await fetch('/pos',{cache:'no-store'});const j=await r.json();
      if(!j.ok){if(!cur||Date.now()-cur.t>4000){$('gps').textContent=j.msg||'測位待ち';$('gps').className='chip ng';}return;}
      if(j.t!==lastT&&!simTimer){lastT=j.t;onFix({timestamp:j.t,coords:{latitude:j.lat,longitude:j.lon,altitude:j.alt,accuracy:j.acc,speed:j.spd,heading:j.hdg}});}
    }catch(e){$('gps').textContent='受け取りプログラム停止';$('gps').className='chip ng';}
  },500);}
const BRIDGE=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&location.port==='8000'&&!/src=gps/.test(location.search);
renderLog();resize();if(BRIDGE)startBridge();else startGPS();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
